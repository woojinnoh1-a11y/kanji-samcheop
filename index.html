body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.55;

<script>
// ---------- pure helpers ----------
const splitAlt=(s,ws)=>String(s||'').split(ws?/[\/,;、，；\s]+/:/[\/,;、，；]+/).map(x=>x.trim()).filter(Boolean);
const toHira=s=>s.replace(/[\u30A1-\u30F6]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
const normKana=s=>toHira(String(s||'').normalize('NFC').replace(/[\s.\-‐・･、,。]/g,''));
const PY_MAP={'ā':['a',1],'á':['a',2],'ǎ':['a',3],'à':['a',4],'ē':['e',1],'é':['e',2],'ě':['e',3],'è':['e',4],
 'ī':['i',1],'í':['i',2],'ǐ':['i',3],'ì':['i',4],'ō':['o',1],'ó':['o',2],'ǒ':['o',3],'ò':['o',4],
 'ū':['u',1],'ú':['u',2],'ǔ':['u',3],'ù':['u',4],'ǖ':['v',1],'ǘ':['v',2],'ǚ':['v',3],'ǜ':['v',4],'ü':['v',0]};
function pyParse(s){
  s=String(s||'').toLowerCase().normalize('NFC').replace(/[\s'’]/g,'').replace(/u:/g,'v');
  let tone=null,base='';
  for(const ch of s){
    if(PY_MAP[ch]){base+=PY_MAP[ch][0];if(PY_MAP[ch][1])tone=PY_MAP[ch][1];}
    else if(/[1-5]/.test(ch)){tone=ch==='5'?0:+ch;}
    else base+=ch;
  }
  return {base,tone};
}
function checkZh(user,expected){
  const u=pyParse(user);if(!u.base)return false;
  return splitAlt(expected,true).some(e=>{const x=pyParse(e);
    return x.base===u.base&&(u.tone===null||x.tone===null||x.tone===u.tone);});
}
function koAnswers(ko){return {eums:splitAlt(ko.eum),huns:splitAlt(ko.hun)};}
function checkKo(user,ko){
  const u=String(user||'').trim().replace(/\s+/g,'');if(!u)return false;
  const {eums,huns}=koAnswers(ko||{});
  if(eums.some(e=>e.replace(/\s+/g,'')===u))return true;
  return huns.some(h=>eums.some(e=>(h+e).replace(/\s+/g,'')===u));
}
function jaAccepts(ja){
  const set=new Set();
  for(const t of splitAlt((ja.on||'')+'/'+(ja.kun||''),true)){
    const full=normKana(t);if(full)set.add(full);
    const stem=normKana(t.split(/[.\-]/)[0]);if(stem.length>=2)set.add(stem);
  }
  return set;
}
const checkJa=(user,ja)=>{const u=normKana(user);return !!u&&jaAccepts(ja||{}).has(u);};
function parseWords(s){return String(s||'').split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\S+)\s+(.+)$/);return m?{w:m[1],r:m[2].trim()}:{w:l,r:''};});}
const fmtWords=a=>(Array.isArray(a)?a:[]).map(x=>x.w+(x.r?' '+x.r:'')).join('\n');
function readSet(str,stem){const s=new Set();for(const t of splitAlt(str,true)){const f=normKana(t);if(f)s.add(f);if(stem){const st=normKana(t.split(/[.\-]/)[0]);if(st.length>=2)s.add(st);}}return s;}
function checkReadings(user,str,stem){const set=readSet(str,stem);const toks=splitAlt(user,true);return set.size>0&&toks.length>0&&toks.every(t=>set.has(normKana(t)));}
function checkWordReading(user,r){const u=normKana(user);return !!u&&splitAlt(r,false).some(x=>normKana(x)===u);}
function weightOf(st){const c=+st?.c||0,w=+st?.w||0;if(c+w===0)return 3;if(w>c)return 7;if(w>0&&c-w<2)return 3;return 1;}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
</script>

<script>
(async function(){
const $=id=>document.getElementById(id);
const LANGS={ko:{tag:'韓',name:'한국',lang:'ko'},ja:{tag:'日',name:'일본',lang:'ja'},zh:{tag:'中',name:'중국',lang:'zh'}};
const MODES=[['jp','日 음·훈·단어'],['sh','자형'],['ko','韓 음·훈'],['zh','中 병음'],['mix','섞어서']];
let db=null,col=null,sample=null,unsub=null;
let cards=[],selId=null,hideRead=false,editId=null,loaded=false;
let quiz={mode:'jp',cur:null,done:false,right:0,total:0,last:null};

// ---------- toast / status ----------
let tt=0;
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600);}
function setStatus(m){const s=$('status');s.textContent=m||'';s.hidden=!m;}

// ---------- write queue ----------
let q=Promise.resolve();
function enqueue(fn){const p=q.then(fn);q=p.catch(()=>{});return p;}
async function dbWrite(fn,okMsg){
  if(!col){toast('저장소에 연결되지 않았어요');return false;}
  try{await enqueue(fn);if(okMsg)toast(okMsg);return true;}
  catch(e){toast(e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼어요':'저장하지 못했어요 ('+(e&&e.code||'오류')+')');return false;}
}

// ---------- tabs ----------
const TABS=['study','quiz','mine'];
function showTab(n){
  TABS.forEach(t=>{$('view-'+t).hidden=t!==n;$('t-'+t).setAttribute('aria-selected',t===n);});
  if(n==='study')renderStudy();
  if(n==='quiz')renderQuiz();
  if(n==='mine')renderMine();
}
TABS.forEach(t=>$('t-'+t).addEventListener('click',()=>showTab(t)));
const curTab=()=>TABS.find(t=>!$('view-'+t).hidden);

// ---------- field schema (add a line here to add a field) ----------
const FIELDS=[
 {c:'ja',k:'form',label:'자형 (신자체)',lang:'ja',auto:'일본 상용한자 자형(신자체)'},
 {c:'ja',k:'on',label:'음독 (カタカナ, 여러 개는 / 로)',lang:'ja',study:'음독'},
 {c:'ja',k:'kun',label:'훈독 (ひらがな, 송리가나는 . 로)',lang:'ja',study:'훈독'},
 {c:'ja',k:'words',label:'기본 음독 단어 (최대 4개)',kind:'pairs',max:4,lang:'ja',study:'기본 단어'},
 {c:'ja',k:'exc',label:'예외로 읽는 단어 (최대 4개)',kind:'pairs',max:4,lang:'ja',study:'예외'},
 {c:'ko',k:'form',label:'자형 (정자)',lang:'ko',auto:'한국 자형(번체/정자)'},
 {c:'ko',k:'hun',label:'훈 (뜻), 여러 개는 / 로',study:'훈'},
 {c:'ko',k:'eum',label:'음',study:'음',auto:'한국 한자음 (예: 학)'},
 {c:'ko',k:'word',label:'단어 예',lang:'ko',study:'단어'},
 {c:'zh',k:'form',label:'자형 (간체)',lang:'zh',auto:'중국 간체자'},
 {c:'zh',k:'py',label:'병음 (xué, xue2, xue 모두 인정)',study:'병음',auto:'성조 기호가 있는 병음'},
 {c:'zh',k:'word',label:'단어 예',lang:'zh',study:'단어'}
];
const CMETA={ja:['日','일본'],ko:['韓','한국'],zh:['中','중국']};
const fieldText=(f,v)=>f.kind==='pairs'?fmtWords(v):(v||'');

// ---------- data ----------
const get=(c,k)=>(c&&c[k])||{};
const baseGlyph=c=>get(c,'ko').form||get(c,'ja').form||get(c,'zh').form||'?';
function cardsSorted(){return cards.slice().sort((a,b)=>(+a.added||0)-(+b.added||0));}

function startDb(){
  const timer=setTimeout(()=>{if(!loaded)setStatus('저장소 응답이 늦어요. 연결되면 자동으로 불러옵니다.');},10000);
  unsub=col.orderBy('added').onSnapshot(snap=>{
    clearTimeout(timer);loaded=true;setStatus('');
    cards=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!cards.find(c=>c.id===selId))selId=cards.length?cardsSorted()[0].id:null;
    const t=curTab();
    if(t==='study')renderStudy();
    if(t==='mine')renderMineList();
    if(t==='quiz'&&!quiz.cur)renderQuiz();
  },e=>{clearTimeout(timer);loaded=true;setStatus(e&&e.code==='revoked'?'접근 권한이 바뀌어 더 이상 불러올 수 없어요.':'저장소를 읽지 못했어요 ('+(e&&e.code||'오류')+')');renderStudy();});
}

    h+=`<div class="col ${k}"><div class="top"><span class="tag ${k}">${LANGS[k].tag} ${LANGS[k].name}</span>${diff}</div>

      reading(k,c).map(([a,b])=>`<dt>${a}</dt><dd${/단어|예외/.test(a)?` lang="${LANGS[k].lang}"`:''}>${esc(b||'—').replace(/\n/g,'<br>')}</dd>`).join('')+'</dl></div>';
  }
  h+='</div>';
  if(c.note)h+=`<p class="note" style="margin-top:12px">${esc(c.note)}</p>`;
  v.innerHTML=h;

  $('b-hide').addEventListener('click',()=>{hideRead=!hideRead;renderStudy();});
  $('b-edit').addEventListener('click',()=>{startEdit(c.id);});
  v.querySelectorAll('.hidden-read dd').forEach(d=>d.addEventListener('click',()=>d.classList.toggle('shown')));
}

function clearForm(){$('f-glyph').value='';writeForm({});editId=null;$('form-title').textContent='한자 추가';$('b-cancel').hidden=true;$('fill-msg').textContent='';}

// ---------- quiz ----------
function eligible(c,m){
  const ko=get(c,'ko'),ja=get(c,'ja'),zh=get(c,'zh');
  if(m==='ko')return !!(ko.form||baseGlyph(c))&&!!ko.eum;
  if(m==='ja')return !!ja.form&&!!(ja.on||ja.kun);
  if(m==='jp')return !!ja.form&&!!(ja.on||ja.kun||(ja.words||[]).length||(ja.exc||[]).length);
  if(m==='zh')return !!zh.form&&!!zh.py;
  if(m==='sh')return !!ko.form&&((ja.form&&ja.form!==ko.form)||(zh.form&&zh.form!==ko.form));
  return false;
}
function pickQ(){
  const modes=quiz.mode==='mix'?['jp','sh','ko']:[quiz.mode];
  const pairs=[];
  for(const c of cards)for(const m of modes)if(eligible(c,m))pairs.push({c,m,w:weightOf(c.stats&&c.stats[m])});
  if(!pairs.length)return null;
  let pool=pairs.length>1&&quiz.last?pairs.filter(p=>!(p.c.id===quiz.last.c&&p.m===quiz.last.m)):pairs;
  let tot=pool.reduce((s,p)=>s+p.w,0),r=Math.random()*tot;
  let p=pool[pool.length-1];
  for(const x of pool){r-=x.w;if(r<=0){p=x;break;}}
  const out={id:p.c.id,m:p.m};
  if(p.m==='sh'){
    const ko=get(p.c,'ko'),opts=['ja','zh'].filter(k=>get(p.c,k).form&&get(p.c,k).form!==ko.form);
    out.target=opts[Math.floor(Math.random()*opts.length)];}
  if(p.m==='jp'){const ja=get(p.c,'ja'),rn=n=>Math.floor(Math.random()*n);const vi=a=>(a||[]).map((x,i)=>x&&x.r?i:-1).filter(i=>i>=0),pk=a=>{const v=vi(a);return v.length?v[rn(v.length)]:-1;};out.wi=pk(ja.words);out.xi=pk(ja.exc);
  }
  return out;
}
function nextQ(){quiz.cur=pickQ();quiz.done=false;if(quiz.cur)quiz.last={c:quiz.cur.id,m:quiz.cur.m};renderQuiz();}
function renderQuiz(){
  const v=$('view-quiz');
  let h='<div class="modes" style="margin-bottom:14px">'+MODES.map(([k,l])=>`<button data-m="${k}" aria-pressed="${quiz.mode===k}">${l}</button>`).join('')+'</div>';
  if(!loaded){v.innerHTML=h+'<div class="empty">불러오는 중…</div>';bindModes(v);return;}
  if(!quiz.cur&&!quiz.done){quiz.cur=pickQ();if(quiz.cur)quiz.last={c:quiz.cur.id,m:quiz.cur.m};}
  const cur=quiz.cur,c=cur&&cards.find(x=>x.id===cur.id);
  if(!cur||!c){
    h+='<div class="empty">'+(cards.length?'이 유형에 필요한 정보(읽기나 다른 자형)가 입력된 한자가 아직 없어요.':'먼저 ‘내 한자’ 탭에서 한자를 추가해 주세요.')+'</div>';
    v.innerHTML=h;bindModes(v);return;
  }
  const ko=get(c,'ko'),ja=get(c,'ja'),zh=get(c,'zh');
  if(cur.m==='jp'){renderJp(v,h,c,cur);return;}
  let glyph,lang,ask,label;
  if(cur.m==='ko'){glyph=ko.form||baseGlyph(c);lang='ko';label='ko';ask='한국에서 읽는 <b>음</b>을 쓰세요 (훈+음도 가능)';}
  else if(cur.m==='ja'){glyph=ja.form;lang='ja';label='ja';ask='일본의 <b>음독 또는 훈독</b>을 히라가나/가타카나로 쓰세요';}
  else if(cur.m==='zh'){glyph=zh.form;lang='zh';label='zh';ask='중국어 <b>병음</b>을 쓰세요 (성조는 생략 가능)';}
  else{glyph=ko.form;lang='ko';label='ko';ask=`이 한국 자형에 해당하는 <b>${LANGS[cur.target].name} 자형</b>을 쓰세요`;}
  h+=`<div class="card"><div class="score">${quiz.total?`${quiz.right} / ${quiz.total} 정답`:'&nbsp;'}</div><div class="q">
    <span class="tag ${label}">${LANGS[label].tag} ${cur.m==='sh'?'→ '+LANGS[cur.target].tag:''}</span>
    <div class="glyph" lang="${lang}">${esc(glyph)}</div><div class="ask">${ask}</div>
    <div class="ans"><input type="text" id="q-in" autocomplete="off" autocapitalize="off" spellcheck="false" ${quiz.done?'disabled':''}>
    <button class="btn" id="q-go">${quiz.done?'다음':'확인'}</button></div><div id="q-fb" style="width:100%;display:flex;justify-content:center"></div></div></div>`;
  v.innerHTML=h;bindModes(v);
  if(quiz.done&&quiz.fb){$('q-in').value=quiz.fb.input;showFb(quiz.fb.ok,c,cur);}
  $('q-go').addEventListener('click',submit);
  $('q-in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();submit();}});
  if(!quiz.done)$('q-in').focus(); else $('q-go').focus();
}
function bindModes(v){v.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{quiz.mode=b.dataset.m;quiz.cur=null;quiz.done=false;quiz.fb=null;quiz.last=null;quiz.right=0;quiz.total=0;renderQuiz();}));}
function expectedText(c,cur){
  const ko=get(c,'ko'),ja=get(c,'ja'),zh=get(c,'zh');
  if(cur.m==='ko')return `${ko.hun?ko.hun+' ':''}${ko.eum}`;
  if(cur.m==='ja')return `음독 ${ja.on||'—'} / 훈독 ${ja.kun||'—'}`;
  if(cur.m==='zh')return zh.py;
  return get(c,cur.target).form;
}
function showFb(ok,c,cur){
  $('q-fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'정답':'오답'}</b><div class="exp">정답: <span lang="${cur.m==='ja'?'ja':'ko'}">${esc(expectedText(c,cur))}</span>${c.gloss?' · '+esc(c.gloss):''}</div></div>`;
}
function submit(){
  const cur=quiz.cur;if(!cur)return;
  if(quiz.done){nextQ();return;}
  if(cur.m==='jp'){submitJp(cur);return;}
  const c=cards.find(x=>x.id===cur.id);if(!c)return;
  const input=$('q-in').value;if(!input.trim())return;
  let ok=false;
  if(cur.m==='ko')ok=checkKo(input,get(c,'ko'));
  else if(cur.m==='ja')ok=checkJa(input,get(c,'ja'));
  else if(cur.m==='zh')ok=checkZh(input,get(c,'zh').py);
  else ok=input.trim()===get(c,cur.target).form;
  quiz.done=true;quiz.total++;if(ok)quiz.right++;quiz.fb={ok,input};
  const prev=(c.stats&&c.stats[cur.m])||{c:0,w:0};
  const nx={c:(+prev.c||0)+(ok?1:0),w:(+prev.w||0)+(ok?0:1)};
  dbWrite(()=>col.doc(c.id).update({stats:{[cur.m]:nx}}));
  renderQuiz();
}

// ---------- japanese quiz ----------
function jpFields(c,cur){
  const ja=get(c,'ja'),f=[];
  if(ja.on)f.push({k:'on',label:'음독',exp:ja.on});
  if(ja.kun)f.push({k:'kun',label:'훈독',exp:ja.kun});
  const w=(ja.words||[])[cur.wi];if(w&&w.r)f.push({k:'w',label:'기본 음독 단어',word:w.w,exp:w.r});
  const x=(ja.exc||[])[cur.xi];if(x&&x.r)f.push({k:'x',label:'예외 읽기 단어',word:x.w,exp:x.r});
  return f;
}
function renderJp(v,h,c,cur){
  const ko=get(c,'ko'),ja=get(c,'ja'),fs=jpFields(c,cur);
  if(!fs.length){v.innerHTML=h+'<div class="empty">이 한자에는 읽기가 입력되지 않았어요.</div>';bindModes(v);return;}
  h+=`<div class="card"><div class="score">${quiz.total?`${quiz.right} / ${quiz.total} 완전 정답`:'&nbsp;'}</div>
    <div class="row" style="gap:28px;align-items:flex-end;justify-content:center">
    <div style="text-align:center"><span class="tag ja">日</span><div class="glyph" lang="ja" style="font-size:110px">${esc(ja.form)}</div></div>
    ${ko.form?`<div style="text-align:center"><span class="tag ko">韓</span><div class="glyph" lang="ko" style="font-size:64px">${esc(ko.form)}</div></div>`:''}</div>
    <div class="jq">`+fs.map((f,i)=>`<div class="jrow"><label>${f.label}${f.word?` <span class="jw" lang="ja">${esc(f.word)}</span>`:''}<input type="text" id="jq-${i}" lang="ja" autocomplete="off" autocapitalize="off" spellcheck="false" ${quiz.done?'disabled':''}></label><div id="jr-${i}"></div></div>`).join('')+
    `</div><div class="row" style="justify-content:center"><button class="btn" id="q-go">${quiz.done?'다음':'확인'}</button></div></div>`;
  v.innerHTML=h;bindModes(v);
  $('q-go').addEventListener('click',submit);
  fs.forEach((f,i)=>{const el=$('jq-'+i);
    el.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;e.preventDefault();
      if(i<fs.length-1)$('jq-'+(i+1)).focus();else submit();});});
  if(quiz.done&&quiz.fb&&quiz.fb.res){showJpRes(fs);$('q-go').focus();}else $('jq-0').focus();
}
function showJpRes(fs){
  fs.forEach((f,i)=>{const r=quiz.fb.res[i];if(!r)return;$('jq-'+i).value=r.input;
    $('jr-'+i).innerHTML=`<div class="jres ${r.ok?'ok':'bad'}">${r.ok?'정답':'오답'} · 정답: <span lang="ja">${esc(f.exp)}</span></div>`;});
}
function submitJp(cur){
  const c=cards.find(x=>x.id===cur.id);if(!c)return;
  const fs=jpFields(c,cur),ins=fs.map((f,i)=>$('jq-'+i).value);
  if(ins.every(s=>!s.trim()))return;
  const res=fs.map((f,i)=>{
    const u=ins[i];let ok=false;
    if(f.k==='on')ok=checkReadings(u,f.exp,false);
    else if(f.k==='kun')ok=checkReadings(u,f.exp,true);
    else ok=checkWordReading(u,f.exp);
    return {ok,input:u};});
  const all=res.every(r=>r.ok);
  quiz.done=true;quiz.total++;if(all)quiz.right++;quiz.fb={res};
  const prev=(c.stats&&c.stats.jp)||{c:0,w:0};
  const nx={c:(+prev.c||0)+(all?1:0),w:(+prev.w||0)+(all?0:1)};
  dbWrite(()=>col.doc(c.id).update({stats:{jp:nx}}));
  renderQuiz();
}

function refreshFill(){$('b-fill').hidden=!(aiSample||getKey());}
refreshFill();
sample={json:async prompt=>{
  if(aiSample)return aiSample.json(prompt);
  const k=getKey();if(!k)throw {code:'not_granted'};
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-haiku-5-5',max_tokens:600,messages:[{role:'user',content:prompt}]})});
  if(r.status===429)throw {code:'rate_limited'};
  if(!r.ok)throw {code:'http_'+r.status};
  const j=await r.json(),t=(j.content&&j.content[0]&&j.content[0].text)||'',m=t.match(/\{[\s\S]*\}/);
  if(!m)throw {code:'invalid_json'};return JSON.parse(m[0]);}};
$('b-key').addEventListener('click',()=>{const v=$('in-key').value.trim();if(!v){toast('키를 입력해 주세요');return;}setKey(v);$('in-key').value='';refreshFill();toast('키를 저장했어요');});
$('b-keyx').addEventListener('click',()=>{setKey('');refreshFill();toast('키를 삭제했어요');});

// backup
$('b-export').addEventListener('click',()=>{
  try{
    const out=cards.map(({id,...d})=>({id,...d}));
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
    a.download='kanji-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
    $('bk-msg').textContent=out.length+'자를 내보냈어요';
  }catch(e){$('bk-msg').textContent='내보내지 못했어요';}
});
$('b-import').addEventListener('click',()=>$('in-file').click());
$('in-file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    let arr=JSON.parse(await f.text());if(!Array.isArray(arr))arr=arr.kanji||[];
    let n=0;
    for(const it of arr){
      if(!it||typeof it!=='object')continue;
      const {id,...d}=it;if(!id)continue;
      const ok=await dbWrite(()=>col.doc(String(id)).set(d));if(ok)n++;
    }
    $('bk-msg').textContent=n+'자를 불러왔어요';
  }catch(err){$('bk-msg').textContent='파일을 읽지 못했어요';}
});

// Gemini via Firebase AI Logic (no API key in the browser)
async function initAI(){
  const base='https://www.gstatic.com/firebasejs/11.10.0/';
  const [{initializeApp},{getAI,getGenerativeModel,GoogleAIBackend}]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-ai.js')]);
  const app=initializeApp(FIREBASE_CONFIG,'ai');
  let ac=null,acGet=null;
  if(FIREBASE_CONFIG.appCheckSiteKey){
    const m=await import(base+'firebase-app-check.js');
    ac=m.initializeAppCheck(app,{provider:new m.ReCaptchaV3Provider(FIREBASE_CONFIG.appCheckSiteKey),isTokenAutoRefreshEnabled:true});
    acGet=m.getToken;
  }
  const ai=getAI(app,{backend:new GoogleAIBackend()});
  const model=getGenerativeModel(ai,{model:FIREBASE_CONFIG.aiModel||'gemini-3.8-flash',generationConfig:{responseMimeType:'application/json'}});
  return {json:async prompt=>{
    let r;
    try{r=await model.generateContent(prompt);}
    catch(e){
      if(ac){try{await acGet(ac,false);}catch(t){throw new Error('App Check 토큰을 받지 못했어요: '+(t.code||t.message));}}
      else throw new Error('앱에 App Check 사이트 키(appCheckSiteKey)가 아직 적용되지 않았어요. '+(e&&e.message||''));
      throw e;
    }
    const t=r.response.text(),m=t.match(/\{[\s\S]*\}/);
    if(!m)throw {code:'invalid_json'};return JSON.parse(m[0]);}};
}

// auth + firestore
const authMsg=e=>{const c=e&&e.code||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c))return '이메일 또는 비밀번호가 맞지 않아요';
  if(c==='auth/email-already-in-use')return '이미 가입된 이메일이에요. 로그인해 주세요';
  if(c==='auth/weak-password')return '비밀번호는 6자 이상이어야 해요';
  if(c==='auth/operation-not-allowed')return 'Firebase에서 이메일/비밀번호 로그인을 켜 주세요';
  if(c==='auth/unauthorized-domain')return 'Firebase > Authentication > 설정 > 승인된 도메인에 이 사이트 주소(아이디.github.io)를 추가해 주세요';
  if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return '';
  if(c==='auth/too-many-requests')return '잠시 후 다시 시도해 주세요';
  return '로그인하지 못했어요 ('+c+')';};
function showLogin(on){$('login').hidden=!on;document.querySelector('.wrap').hidden=on;}
let auth=null,fs=null;
try{
  if(typeof firebase==='undefined')throw new Error('LIB');
  if(typeof FIREBASE_CONFIG==='undefined')throw new Error('NOCONFIG');
  if(!FIREBASE_CONFIG.apiKey||/여기/.test(FIREBASE_CONFIG.apiKey))throw new Error('EMPTY');
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  initAI().then(a=>{aiSample=a;refreshFill();}).catch(()=>{});
}catch(e){
  auth=null;showLogin(true);
  const m=e&&e.message||String(e);
  $('l-msg').textContent=
    m==='LIB'?'Firebase 라이브러리를 불러오지 못했어요. 광고/콘텐츠 차단 기능을 끄거나 다른 네트워크에서 새로 고침해 보세요.':
    m==='NOCONFIG'?'firebase-config.js 를 읽지 못했어요. 파일 첫 줄이 const FIREBASE_CONFIG = { 인지, 파일 이름이 정확한지 확인해 주세요.':
    m==='EMPTY'?'firebase-config.js 의 apiKey 가 비어 있거나 예시 그대로예요.':
    '시작 오류: '+m;
}
if(auth){
  $('b-login').addEventListener('click',async()=>{$('l-msg').textContent='';try{await auth.signInWithEmailAndPassword($('l-email').value.trim(),$('l-pw').value);}catch(e){$('l-msg').textContent=authMsg(e);}});
  $('b-signup').addEventListener('click',async()=>{$('l-msg').textContent='';try{await auth.createUserWithEmailAndPassword($('l-email').value.trim(),$('l-pw').value);}catch(e){$('l-msg').textContent=authMsg(e);}});
  $('l-pw').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('b-login').click();}});
  $('b-google').addEventListener('click',async()=>{
    $('l-msg').textContent='';
    const pr=new firebase.auth.GoogleAuthProvider();
    try{await auth.signInWithPopup(pr);}
    catch(e){
      if(/popup-blocked|operation-not-supported|web-storage-unsupported/.test(e&&e.code||'')){try{await auth.signInWithRedirect(pr);}catch(e2){$('l-msg').textContent=authMsg(e2);}}
      else $('l-msg').textContent=authMsg(e);
    }
  });
  auth.getRedirectResult().catch(e=>{$('l-msg').textContent=authMsg(e);});
  $('b-out').addEventListener('click',()=>auth.signOut());
  auth.onAuthStateChanged(u=>{
    if(unsub){unsub();unsub=null;}
    if(u){
      showLogin(false);$('b-out').hidden=false;
      const fcol=fs.collection('users/'+u.uid+'/kanji');
      col={orderBy:f=>fcol.orderBy(f),
        doc:id=>{const d=id?fcol.doc(id):fcol.doc();return {set:x=>d.set(x),update:x=>d.set(x,{merge:true}),delete:()=>d.delete()};}};
      loaded=false;startDb();
    }else{col=null;cards=[];loaded=false;selId=null;$('b-out').hidden=true;showLogin(true);}
  });
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
